<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Карта — Frendly Map</title>
  <link rel="stylesheet" href="/static/page-theme.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 70vh; border-radius: 12px; }
    .map-controls { background:#fff; padding:10px; border-radius:10px; display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .map-controls input,.map-controls select,.map-controls button { padding:8px 10px; border:1px solid #d6e2ef; border-radius:8px; }
    .map-controls button { background:#fff; cursor:pointer; }
  </style>
</head>
<body class="site-theme">
  <nav class="top-nav reveal">
    <a href="/">Главная</a>
    <a href="/map" class="active">Карта</a>
    <a href="/add-location">Добавить</a>
    <a href="/achievements">Достижения</a>
    <a href="/leaderboard">Топ</a>
    <a href="/faq">Помощь</a>
    {% if current_user_id %}<a href="/profile/me">Мой профиль</a><a href="/logout">Выйти</a>{% else %}<a href="/login">Войти</a>{% endif %}
  </nav>
  <main class="page-shell">
    <section class="surface-card">
      <h1 class="page-title">Карта подтверждённых локаций</h1>
      <div class="map-controls">
        <input id="search" placeholder="Поиск по названию/описанию">
        <select id="tagFilter"><option value="">Все теги</option></select>
        <button id="applyFilters" type="button">Применить</button>
        <button id="myGeo" type="button">Моя геопозиция</button>
      </div>
      <div id="map"></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([55.751244, 37.618423], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(map);
    const markersLayer = L.layerGroup().addTo(map);

    async function loadLocations() {
      const q = document.getElementById('search').value.trim();
      const tag = document.getElementById('tagFilter').value;
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      if (tag) params.set('tag', tag);
      const res = await fetch('/api/map/locations?' + params.toString());
      const items = await res.json();

      markersLayer.clearLayers();
      const tagSet = new Set();
      items.forEach(loc => {
        const marker = L.marker([loc.latitude, loc.longitude]).addTo(markersLayer);
        const tags = (loc.tags || []).join(', ') || '—';
        (loc.tags || []).forEach(t => tagSet.add(t));
        const photo = loc.photo_url ? `<img src="${loc.photo_url}" style="max-width:220px;display:block;margin-top:6px;">` : '';
        marker.bindPopup(`<strong>${loc.name}</strong><br>${loc.description || ''}<br><small>Теги: ${tags}</small>${photo}`);
      });

      const select = document.getElementById('tagFilter');
      const current = select.value;
      select.innerHTML = '<option value="">Все теги</option>';
      Array.from(tagSet).sort().forEach(tagName => {
        const option = document.createElement('option');
        option.value = tagName;
        option.textContent = tagName;
        if (tagName === current) option.selected = true;
        select.appendChild(option);
      });
    }

    document.getElementById('applyFilters').addEventListener('click', loadLocations);
    document.getElementById('myGeo').addEventListener('click', () => {
      if (!navigator.geolocation) return alert('Геолокация недоступна');
      navigator.geolocation.getCurrentPosition(
        (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 14),
        () => alert('Не удалось определить геопозицию'),
      );
    });

    loadLocations();
  </script>
  <!-- Jivo widget -->
  <script src="//code.jivo.ru/widget/FaDWcuzcG6" async></script>
</body>
</html>
