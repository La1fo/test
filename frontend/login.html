<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Frendly Map</title>
  <link rel="stylesheet" href="/static/page-theme.css" />
</head>
<body class="site-theme">
  {% include "_nav.html" %}

  <main class="page-shell">
    <section class="surface-card" style="max-width:560px;">
      <h1 class="page-title">Вход</h1>
      <p class="muted-text">Авторизуйтесь через email или Telegram.</p>
      <div class="field"><input id="email" type="email" placeholder="Email"></div>
      <div class="field"><input id="password" type="password" placeholder="Пароль"></div>
      <button class="btn-primary" id="emailLoginBtn" type="button">Войти по email</button>

      <hr style="margin:16px 0;">

      <h2 style="font-size:20px;margin:0 0 8px;">Регистрация</h2>
      <div class="field"><input id="regUsername" placeholder="Username"></div>
      <div class="field"><input id="regEmail" type="email" placeholder="Email"></div>
      <div class="field"><input id="regPassword" type="password" placeholder="Пароль"></div>
      <div class="field"><input id="regPasswordConfirm" type="password" placeholder="Подтвердите пароль"></div>
      <button class="btn-primary" id="registerBtn" type="button">Зарегистрироваться</button>

      <hr style="margin:16px 0;">

      <button class="btn-primary" id="tgLoginBtn" type="button">Войти через Telegram WebApp</button>
      <p class="muted-text">Откройте сайт внутри Telegram для автоматической передачи init_data.</p>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const next = new URLSearchParams(window.location.search).get('next') || '/';
    const status = document.getElementById('status');

    async function loginViaEmail() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/session/email', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email, password, next}),
      });
      if (res.ok) window.location.href = next;
      else status.textContent = (await res.json()).detail || 'Ошибка входа';
    }

    async function loginViaTelegram() {
      const init_data = window.Telegram?.WebApp?.initData || '';
      if (!init_data) {
        status.textContent = 'Telegram init_data не найден. Откройте страницу внутри Telegram WebApp.';
        return;
      }
      const res = await fetch('/api/session/telegram', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({init_data, next}),
      });
      if (res.ok) window.location.href = next;
      else status.textContent = (await res.json()).detail || 'Ошибка входа';
    }

    async function registerViaEmail() {
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm_password = document.getElementById('regPasswordConfirm').value;
      const res = await fetch('/api/session/register', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({username, email, password, confirm_password, next}),
      });
      if (res.ok) window.location.href = next || '/profile/me';
      else status.textContent = (await res.json()).detail || 'Ошибка регистрации';
    }

    document.getElementById('emailLoginBtn').addEventListener('click', loginViaEmail);
    document.getElementById('registerBtn').addEventListener('click', registerViaEmail);
    document.getElementById('tgLoginBtn').addEventListener('click', loginViaTelegram);

    // Авто-bootstrap web-сессии, если страница открыта внутри Telegram WebApp.
    if (window.Telegram?.WebApp?.initData) {
      loginViaTelegram();
    }
  </script>
  <!-- Jivo widget -->
  <script src="//code.jivo.ru/widget/FaDWcuzcG6" async></script>
</body>
</html>
