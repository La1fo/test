<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Frendly Map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: url('/static/images/city-bg-full.png') center center / 101% auto no-repeat fixed;
      background-color: #cbe6f7;
    }

    .top-nav {
      background: rgba(255, 255, 255, 0.9);
      padding: 14px 30px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin: 40px auto 70px;
      width: 100%;
      max-width: 700px;
      z-index: 10;
    }

    .top-nav a {
      padding: 8px 16px;
      text-decoration: none;
      color: #0077cc;
      font-weight: 600;
      font-size: 1.05rem;
      border-radius: 30px;
      transition: all 0.2s ease;
    }

    .top-nav a:hover,
    .top-nav a.active {
      background: #2997f5;
      color: white;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 { font-size: 2rem; margin-bottom: 20px; color: #006699; }
    .info-text { margin-bottom: 25px; line-height: 1.5; color: #555; }

    .email-login { margin-top: 20px; }
    .email-form { display: flex; gap: 8px; }

    .email-form input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .email-form button {
      padding: 10px 16px;
      background: #2997f5;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background .2s ease;
    }

    .email-form button:hover { background: #1a7bd8; }
    .message { text-align: center; padding: 12px; border-radius: 6px; margin: 15px 0; display: none; }
    .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .message.error { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/">Главная</a>
    <a href="/achievements">Достижения</a>
    <a href="/leaderboard">Топ</a>
    <a href="/faq">Помощь</a>
  </nav>

  <div class="container">
    <h2>Вход по Telegram</h2>
    <p class="info-text">Временно недоступен</p>

    <div class="email-login">
      <form id="emailLoginForm" onsubmit="handleEmailLogin(event)">
        <div class="email-form">
          <input type="email" id="emailInput" placeholder="Введите email" required>
          <button type="submit">Войти</button>
        </div>
      </form>
      <div id="emailMessage" class="message"></div>
    </div>
  </div>

  <script>
    function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      if (!email) {
        alert('Введите email');
        return;
      }
      window.location.href = '';
    }
  </script>
  <script src="//code.jivo.ru/widget/FaDWcuzcG6" async></script>
</body>
</html>
