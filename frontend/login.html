<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Frendly Map</title>
  <link rel="stylesheet" href="/static/page-theme.css" />
</head>
<body class="site-theme auth-theme">
  {% include "_nav.html" %}

  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-badge">FriendlyMap ID</div>
      <h1 class="auth-title">Добро пожаловать</h1>
      <p class="auth-subtitle">Войдите по имени пользователя — без запроса почты и лишних шагов.</p>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <label class="auth-field" for="username">
          <span>Имя пользователя</span>
          <input id="username" name="username" autocomplete="username" placeholder="например, friendly_user" required />
        </label>
        <label class="auth-field" for="password">
          <span>Пароль</span>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" required />
        </label>
        <button class="auth-submit" id="loginBtn" type="submit">Войти</button>
      </form>

      <div id="status" class="auth-status" role="status" aria-live="polite"></div>

      <p class="auth-switch">
        Ещё нет аккаунта?
        <a id="registerLink" href="/register">Создать профиль</a>
      </p>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next') || '/';
    const status = document.getElementById('status');
    const registerLink = document.getElementById('registerLink');
    registerLink.href = `/register?next=${encodeURIComponent(next)}`;

    function formatError(detail, fallback) {
      if (!detail) return fallback;
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) {
        return detail.map((item) => item?.msg || item?.message || JSON.stringify(item)).join('; ');
      }
      return detail.msg || detail.message || fallback;
    }

    async function readJson(response) {
      try { return await response.json(); } catch (_) { return {}; }
    }

    async function login(event) {
      event.preventDefault();
      status.textContent = 'Проверяем данные…';
      status.classList.remove('error');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/session/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, next }),
      });

      if (res.ok) {
        window.location.href = next;
        return;
      }

      const data = await readJson(res);
      status.textContent = formatError(data.detail, 'Не удалось войти');
      status.classList.add('error');
    }

    document.getElementById('loginForm').addEventListener('submit', login);
  </script>
  <!-- Jivo widget -->
  <script src="//code.jivo.ru/widget/FaDWcuzcG6" async></script>
</body>
</html>
