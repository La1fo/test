<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Frendly Map — Сделай город доступнее</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      text-align: center;
      background: url('/static/images/city-bg-full.png') center center / 101% auto no-repeat fixed;
      background-color: #cbe6f7;
    }

    .top-nav {
      background: rgba(255, 255, 255, 0.9);
      padding: 14px 30px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin: 40px auto 88px;
      width: 100%;
      max-width: 700px;
      z-index: 10;
    }

    .top-nav a {
      padding: 8px 16px;
      text-decoration: none;
      color: #0077cc;
      font-weight: 600;
      font-size: 1.15rem;
      border-radius: 30px;
      transition: all 0.2s ease;
    }

    .top-nav a:hover,
    .top-nav a.active {
      background: #2997f5;
      color: white;
    }

    .hero-card {
      background: white;
      border-radius: 120px;
      padding: 40px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeUp .5s ease both;
    }

    .hero-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hero-logo-icon {
      width: 64px;
      height: auto;
      border-radius: 50%;
      background: white;
      padding: 4px;
    }

    .hero-logo-text {
      font-size: 2.2rem;
      color: #006699;
      font-weight: 600;
    }

    .hero-slogan {
      font-size: 1.35rem;
      color: #666;
      margin: 14px 0;
      line-height: 1.4;
    }

    .btn-telegram {
      width: 100%;
      max-width: 340px;
      padding: 16px 24px;
      background: #2997f5;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(41, 151, 245, 0.45);
      margin-top: 18px;
      transition: all 0.25s ease;
    }

    .btn-telegram:hover {
      background: #1a7bd8;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(41, 151, 245, 0.55);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .email-pill {
      margin-top: 18px;
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255,255,255,.94);
      border: 1px solid #d7e7ff;
      border-radius: 999px;
      color: #32506a;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      animation: fadeUp .55s ease both;
    }

    .email-pill a {
      color: #0b67b2;
      text-decoration: none;
    }

    .email-pill a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="/" class="active">Главная</a>
    <a href="/achievements">Достижения</a>
    <a href="/leaderboard">Топ</a>
    <a href="/faq">Помощь</a>
  </nav>

  <div class="hero-card">
    <div class="hero-logo">
      <img src="/static/images/logo.png" alt="Frendly Map" class="hero-logo-icon">
      <div class="hero-logo-text">Frendly Map</div>
    </div>
    <div class="hero-slogan">Добавляй метки и повышайте ранг</div>
    <button id="botLink" class="btn-telegram">Начать в Telegram</button>
  </div>

  <div class="email-pill">Почта: <a href="mailto:friendlymapbot@gmail.com">friendlymapbot@gmail.com</a></div>

  <script>
    document.getElementById("botLink").addEventListener("click", (e) => {
      e.preventDefault();
      window.open("https://t.me/Friendly_MapBot", '_blank');
    });
  </script>
  <script src="//code.jivo.ru/widget/FaDWcuzcG6" async></script>
</body>
</html>
